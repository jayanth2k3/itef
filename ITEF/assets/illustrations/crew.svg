<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="A diverse crew of seafarers and port workers standing together">
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6fd1"/>
      <stop offset="0.7" stop-color="#8cc2f5"/>
      <stop offset="1" stop-color="#d7ebff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="560" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="800" height="560" fill="url(#csky)"/>
    <!-- globe lines -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
      <circle cx="400" cy="250" r="230"/>
      <ellipse cx="400" cy="250" rx="110" ry="230"/>
      <line x1="400" y1="20" x2="400" y2="480"/>
      <line x1="170" y1="250" x2="630" y2="250"/>
      <path d="M190 150 Q400 190 610 150 M190 350 Q400 310 610 350"/>
    </g>
    <!-- sea -->
    <rect y="330" width="800" height="230" fill="#2d7fe0"/>
    <path d="M0 330 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V360 H0 Z" fill="#5aa0ec"/>

    <!-- person: x center, skin, outfit, extra -->
    <!-- 1 captain -->
    <g transform="translate(120 0)">
      <path d="M-82 560 Q-82 420 0 405 Q82 420 82 560 Z" fill="#f4f6fa"/>
      <path d="M-60 430 L-82 445 L-80 460 L-52 446 Z M60 430 L82 445 L80 460 L52 446 Z" fill="#0b2a66"/>
      <path d="M-62 432 L-80 444 M62 432 L80 444" stroke="#e7b416" stroke-width="3"/>
      <path d="M-16 405 L0 440 L16 405 Z" fill="#0b2a66"/>
      <rect x="-14" y="370" width="28" height="40" fill="#8a5a3b"/>
      <ellipse cx="0" cy="335" rx="40" ry="48" fill="#8a5a3b"/>
      <path d="M-46 305 Q0 260 46 305 L44 316 L-44 316 Z" fill="#f4f6fa"/>
      <rect x="-48" y="306" width="96" height="12" rx="4" fill="#0b2a66"/>
      <path d="M-50 318 Q0 332 50 318 L50 324 Q0 338 -50 324 Z" fill="#0a1a3a"/>
      <circle cx="0" cy="296" r="7" fill="#e7b416"/>
    </g>
    <!-- 2 orange helmet, hi-vis -->
    <g transform="translate(260 10)">
      <path d="M-82 560 Q-82 420 0 405 Q82 420 82 560 Z" fill="#0b2a66"/>
      <path d="M-62 425 L-40 560 L-20 560 L-36 418 Z M62 425 L40 560 L20 560 L36 418 Z" fill="#f37a21"/>
      <rect x="-60" y="480" width="120" height="10" fill="#e8eef8" opacity="0.8"/>
      <rect x="-14" y="370" width="28" height="40" fill="#6b4329"/>
      <ellipse cx="0" cy="335" rx="40" ry="48" fill="#6b4329"/>
      <path d="M-46 318 Q-46 266 0 264 Q46 266 46 318 Z" fill="#f37a21"/>
      <rect x="-54" y="312" width="108" height="10" rx="5" fill="#d9661a"/>
    </g>
    <!-- 3 white helmet, yellow vest -->
    <g transform="translate(400 -6)">
      <path d="M-84 566 Q-84 420 0 405 Q84 420 84 566 Z" fill="#1f4f9a"/>
      <path d="M-70 432 Q-78 470 -74 566 L74 566 Q78 470 70 432 L30 410 L0 470 L-30 410 Z" fill="#d8e83a"/>
      <rect x="-74" y="500" width="148" height="10" fill="#e8eef8" opacity="0.9"/>
      <rect x="-14" y="370" width="28" height="40" fill="#a4704a"/>
      <ellipse cx="0" cy="335" rx="40" ry="48" fill="#a4704a"/>
      <path d="M-46 318 Q-46 264 0 262 Q46 264 46 318 Z" fill="#ffffff"/>
      <rect x="-54" y="312" width="108" height="10" rx="5" fill="#dfe5ee"/>
    </g>
    <!-- 4 blue cap, rope -->
    <g transform="translate(540 10)">
      <path d="M-82 560 Q-82 420 0 405 Q82 420 82 560 Z" fill="#2d7fe0"/>
      <path d="M-70 440 Q0 520 70 440" fill="none" stroke="#c9b38a" stroke-width="10" stroke-dasharray="6 4"/>
      <rect x="-14" y="370" width="28" height="40" fill="#7a4e30"/>
      <ellipse cx="0" cy="335" rx="40" ry="48" fill="#7a4e30"/>
      <path d="M-44 316 Q-44 272 0 270 Q44 272 44 316 Z" fill="#1f4f9a"/>
      <path d="M20 312 Q60 310 72 322 L30 322 Z" fill="#163d7a"/>
    </g>
    <!-- 5 yellow helmet, orange coverall -->
    <g transform="translate(680 0)">
      <path d="M-82 560 Q-82 420 0 405 Q82 420 82 560 Z" fill="#f37a21"/>
      <path d="M-20 408 L0 450 L20 408" fill="none" stroke="#c45a12" stroke-width="5"/>
      <rect x="-50" y="470" width="30" height="24" rx="3" fill="#d9661a"/>
      <rect x="-14" y="370" width="28" height="40" fill="#9a6440"/>
      <ellipse cx="0" cy="335" rx="40" ry="48" fill="#9a6440"/>
      <path d="M-46 318 Q-46 266 0 264 Q46 266 46 318 Z" fill="#f2c218"/>
      <rect x="-54" y="312" width="108" height="10" rx="5" fill="#d8a910"/>
    </g>
  </g>
</svg>
